spring.application.name=psm
server.port=${PORT:8080}

# ---------- Base de donnees MySQL (creee automatiquement si absente) ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:psm_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT (secret en Base64, >= 256 bits). A CHANGER en production via la variable JWT_SECRET ----------
jwt.secret=${JWT_SECRET:h2g9TniN374bBZzzA/AucW11twGqFmvaAG0F/GExL2Uj12+nFP7Fr59VgHZWyCNK}
jwt.expiration-ms=86400000

# ---------- Compte admin cree au demarrage ----------
app.admin.email=${ADMIN_EMAIL:admin@psm.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
# Adresse qui recoit l'email a chaque nouvelle inscription
app.admin.notify-email=${ADMIN_NOTIFY_EMAIL:admin@psm.com}
# Insere 3 clients / 4 projets de demonstration si la base est vide
app.seed-demo-data=${SEED_DEMO_DATA:true}

# ---------- CORS (Angular en developpement : ng serve sur :4200) ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ---------- Email (SMTP). Exemple Mailtrap / Gmail : voir README ----------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@psm.com}
