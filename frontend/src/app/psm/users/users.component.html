<app-page-header title="Utilisateurs"></app-page-header>

<div class="row">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-header border-0">
        <div class="row g-3 align-items-center">
          <div class="col-sm">
            <h5 class="card-title mb-0">Liste des utilisateurs <span class="badge bg-primary ms-1">{{ filtered.length }}</span></h5>
          </div>
          <div class="col-sm-auto">
            <div class="search-box">
              <input type="text" class="form-control" placeholder="Rechercher..." [(ngModel)]="search" (ngModelChange)="page = 1">
              <i class="ri-search-line search-icon"></i>
            </div>
          </div>
        </div>
      </div>

      <div class="card-body pt-0">
        <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
        <div class="text-center py-4" *ngIf="loading"><div class="spinner-border text-primary"></div></div>

        <div class="table-responsive table-card mb-3" *ngIf="!loading">
          <table class="table table-nowrap align-middle mb-0">
            <thead class="table-light text-muted">
              <tr>
                <th>#</th>
                <th>Nom</th>
                <th>Prenom</th>
                <th>Email</th>
                <th>Telephone</th>
                <th>Roles</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let u of paged">
                <td>{{ u.id }}</td>
                <td class="fw-medium">{{ u.nom }}</td>
                <td>{{ u.prenom }}</td>
                <td>{{ u.email }}</td>
                <td>{{ u.tel }}</td>
                <td>
                  <span *ngFor="let r of u.roles" class="badge me-1"
                    [ngClass]="r === 'ADMIN' ? 'bg-danger' : 'bg-info'">{{ r }}</span>
                </td>
                <td class="text-end">
                  <button class="btn btn-sm btn-soft-primary me-1" title="Modifier" (click)="openForm(u)">
                    <i class="ri-pencil-fill"></i>
                  </button>
                  <button class="btn btn-sm btn-soft-danger" title="Supprimer" [disabled]="isSelf(u)" (click)="remove(u)">
                    <i class="ri-delete-bin-5-fill"></i>
                  </button>
                </td>
              </tr>
              <tr *ngIf="filtered.length === 0">
                <td colspan="7" class="text-center text-muted py-4">Aucun utilisateur trouve.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="d-flex justify-content-end" *ngIf="filtered.length > pageSize">
          <ngb-pagination [collectionSize]="filtered.length" [(page)]="page" [pageSize]="pageSize"
            [maxSize]="5" [rotate]="true" size="sm"></ngb-pagination>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal modification (infos + roles) -->
<ng-template #formModal let-modal>
  <div class="modal-header bg-light p-3">
    <h5 class="modal-title">Modifier l'utilisateur</h5>
    <button type="button" class="btn-close" aria-label="Fermer" (click)="modal.dismiss()"></button>
  </div>
  <form [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="modal-body">
      <div class="alert alert-danger" *ngIf="formError">{{ formError }}</div>

      <div class="mb-3" *ngIf="editing">
        <label class="form-label">Email</label>
        <input type="text" class="form-control" [value]="editing.email" disabled>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="u-nom">Nom <span class="text-danger">*</span></label>
          <input type="text" id="u-nom" class="form-control" formControlName="nom"
            [ngClass]="{ 'is-invalid': submitted && form.controls['nom'].errors }">
          <div class="invalid-feedback">Le nom est obligatoire</div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="u-prenom">Prenom <span class="text-danger">*</span></label>
          <input type="text" id="u-prenom" class="form-control" formControlName="prenom"
            [ngClass]="{ 'is-invalid': submitted && form.controls['prenom'].errors }">
          <div class="invalid-feedback">Le prenom est obligatoire</div>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="u-tel">Telephone</label>
        <input type="text" id="u-tel" class="form-control" formControlName="tel">
      </div>

      <div class="mb-1">
        <label class="form-label d-block">Roles</label>
        <div class="form-check form-check-inline" *ngFor="let r of allRoles">
          <input class="form-check-input" type="checkbox" [id]="'role-' + r"
            [checked]="selectedRoles.has(r)" (change)="toggleRole(r, $any($event.target).checked)">
          <label class="form-check-label" [for]="'role-' + r">{{ r }}</label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-light" (click)="modal.dismiss()">Annuler</button>
      <button type="submit" class="btn btn-success" [disabled]="saving">
        <span class="spinner-border spinner-border-sm me-1" *ngIf="saving"></span>
        Enregistrer
      </button>
    </div>
  </form>
</ng-template>
