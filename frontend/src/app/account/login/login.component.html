<div class="auth-page-wrapper pt-5">
  <div class="auth-one-bg-position auth-one-bg" id="auth-particles">
    <div class="bg-overlay"></div>
    <div class="shape">
      <svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 120">
        <path d="M 0,36 C 144,53.6 432,123.2 720,124 C 1008,124.8 1296,56.8 1440,40L1440 140L0 140z"></path>
      </svg>
    </div>
  </div>

  <div class="auth-page-content">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="text-center mt-sm-5 mb-4 text-white-50">
            <a routerLink="/" class="d-inline-block auth-logo">
              <img src="assets/images/logo-light.png" alt="PSM" height="20">
            </a>
            <p class="mt-3 fs-15 fw-medium">Projects Manager - SmartSoft Solutions</p>
          </div>
        </div>
      </div>

      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">
          <div class="card mt-4">
            <div class="card-body p-4">
              <div class="text-center mt-2">
                <h5 class="text-primary">Bienvenue !</h5>
                <p class="text-muted">Connectez-vous pour acceder a PSM.</p>
              </div>

              <div class="alert alert-danger mt-3 mb-0" role="alert" *ngIf="error">{{ error }}</div>

              <div class="p-2 mt-4">
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
                  <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" id="email" formControlName="email"
                      placeholder="Entrez votre email" autocomplete="username"
                      [ngClass]="{ 'is-invalid': submitted && f['email'].errors }">
                    <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
                      <div *ngIf="f['email'].errors['required']">L'email est obligatoire</div>
                      <div *ngIf="f['email'].errors['email']">Email invalide</div>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label" for="password-input">Mot de passe</label>
                    <div class="position-relative auth-pass-inputgroup mb-3">
                      <input [type]="fieldTextType ? 'text' : 'password'" class="form-control pe-5"
                        placeholder="Entrez votre mot de passe" id="password-input" formControlName="password"
                        autocomplete="current-password"
                        [ngClass]="{ 'is-invalid': submitted && f['password'].errors }">
                      <button class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted"
                        type="button" (click)="toggleFieldTextType()">
                        <i class="mdi align-middle" [ngClass]="{'mdi-eye-off-outline': !fieldTextType, 'mdi-eye-outline': fieldTextType}"></i>
                      </button>
                      <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
                        Le mot de passe est obligatoire
                      </div>
                    </div>
                  </div>

                  <div class="mt-4">
                    <button class="btn btn-success w-100" type="submit" [disabled]="loading">
                      <span class="spinner-border spinner-border-sm me-1" *ngIf="loading"></span>
                      Se connecter
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <div class="mt-4 text-center">
            <p class="mb-0">Pas encore de compte ?
              <a routerLink="/auth/register" class="fw-semibold text-primary text-decoration-underline">Creer un compte</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="text-center">
            <p class="mb-0 text-muted">&copy; {{ year }} PSM - SmartSoft Solutions</p>
          </div>
        </div>
      </div>
    </div>
  </footer>
</div>
