<header id="page-topbar" data-scroll-header (window:scroll)="windowScroll()">
    <div class="layout-width">
        <div class="navbar-header">
            <div class="d-flex">
                <!-- LOGO -->
                <div class="navbar-brand-box horizontal-logo">
                    <a routerLink="/" class="logo logo-dark">
                        <span class="logo-sm"><img src="assets/images/logo-sm.png" alt="" height="22"></span>
                        <span class="logo-lg"><img src="assets/images/logo-dark.png" alt="" height="17"></span>
                    </a>
                    <a routerLink="/" class="logo logo-light">
                        <span class="logo-sm"><img src="assets/images/logo-sm.png" alt="" height="22"></span>
                        <span class="logo-lg"><img src="assets/images/logo-light.png" alt="" height="17"></span>
                    </a>
                </div>

                <button type="button" class="btn btn-sm px-3 fs-16 header-item vertical-menu-btn topnav-hamburger"
                    id="topnav-hamburger-icon" (click)="toggleMobileMenu($event)">
                    <span class="hamburger-icon">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </button>

                <div class="d-none d-md-flex align-items-center ms-2">
                    <span class="fw-semibold fs-15 text-primary">PSM</span>
                    <span class="text-muted ms-2">Projects Manager</span>
                </div>
            </div>

            <div class="d-flex align-items-center">
                <!-- Plein ecran -->
                <div class="ms-1 header-item d-none d-sm-flex">
                    <button type="button" class="btn btn-icon btn-topbar btn-ghost-secondary rounded-circle"
                        data-toggle="fullscreen" (click)="fullscreen()">
                        <i class='bx bx-fullscreen fs-22'></i>
                    </button>
                </div>

                <!-- Mode clair / sombre -->
                <div class="ms-1 header-item d-none d-sm-flex">
                    <button type="button" class="btn btn-icon btn-topbar btn-ghost-secondary rounded-circle light-dark-mode"
                        (click)="toggleMode()">
                        <i class='bx bx-moon fs-22'></i>
                    </button>
                </div>

                <!-- Utilisateur connecte -->
                <div class="dropdown ms-sm-3 header-item topbar-user" ngbDropdown>
                    <button type="button" class="btn" id="page-header-user-dropdown" ngbDropdownToggle>
                        <span class="d-flex align-items-center">
                            <span class="avatar-xs">
                                <span class="avatar-title rounded-circle bg-primary text-white">{{ initials }}</span>
                            </span>
                            <span class="text-start ms-xl-2" *ngIf="user">
                                <span class="d-none d-xl-inline-block ms-1 fw-medium user-name-text">{{ user.prenom }} {{ user.nom }}</span>
                                <span class="d-none d-xl-block ms-1 fs-12 text-muted user-name-sub-text">{{ roleLabel }}</span>
                            </span>
                        </span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end" ngbDropdownMenu>
                        <h6 class="dropdown-header" *ngIf="user">{{ user.email }}</h6>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="javascript:void(0);" (click)="logout()">
                            <i class="mdi mdi-logout text-muted fs-16 align-middle me-1"></i>
                            <span class="align-middle">Se deconnecter</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
